<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Microsoft 365 — Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      overflow:auto;
      background:#171717;
      color:#f4f4f4;
      font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif;
    }
    button, input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    #stage {
      min-height:100%;
      display:grid;
      place-items:center;
      padding:26px;
    }
    .window-shell {
      width:min(1120px,100%);
      height:520px;
      padding:10px;
      border-radius:38px;
      background:linear-gradient(145deg,#252525,#1b1b1b 58%,#242424);
      border:1px solid rgba(255,255,255,.055);
      box-shadow:0 22px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.035);
    }
    .surface {
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      border-radius:29px;
      border:1px solid rgba(255,255,255,.075);
      background:
        radial-gradient(ellipse at 28% 100%,rgba(40,77,32,.37),transparent 46%),
        linear-gradient(125deg,#191a1b 0%,#17191a 62%,#1b211a 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
    }
    .wallpaper {
      position:absolute; inset:0; width:100%; height:100%;
      pointer-events:none; opacity:.45;
    }
    .layout {
      position:absolute;
      inset:27px 14px 26px 38px;
      display:grid;
      grid-template-columns:minmax(0,1.48fr) minmax(225px,.82fr) 300px;
      gap:22px;
      z-index:1;
    }
    .intro { padding-top:1px; max-width:460px; }
    .brand-title { font-size:15px; line-height:1.35; font-weight:700; letter-spacing:-.25px; }
    .intro-copy {
      margin-top:8px; max-width:420px; color:#b8b8b8;
      font-size:14px; line-height:1.48;
    }
    .upgrade {
      margin-top:16px; height:29px; padding:0 12px;
      border-radius:9px; background:#f3f3f3; color:#232323;
      font-size:12px; font-weight:500; transition:transform .16s,background .16s;
    }
    .upgrade:hover { background:#fff; transform:translateY(-1px); }
    .apps { margin-top:13px; }
    .app-row {
      display:flex; align-items:center; width:100%; height:54px;
      border-bottom:1px solid rgba(255,255,255,.055);
      color:#f1f1f1; text-align:left; transition:background .16s;
    }
    .app-row:last-child { border-bottom:0; }
    .app-row:hover { background:rgba(255,255,255,.045); }
    .app-name { margin-left:11px; font-size:14px; }
    .app-open { margin-left:auto; color:#a3a3a3; transition:transform .15s,color .15s; }
    .app-row:hover .app-open { color:#fff; transform:translate(2px,-2px); }
    .beta {
      margin-left:10px; padding:2px 7px; border:1px solid #315273;
      border-radius:999px; color:#9fc8f4; font-size:11px;
    }
    .app-icon { width:22px; height:22px; flex:none; filter:drop-shadow(0 2px 3px #0005); }
    .sources { padding-top:126px; min-width:0; }
    .source-status {
      display:flex; align-items:center; gap:9px; margin:0 0 7px;
      color:#d69c82; font-size:13px; font-style:italic;
    }
    .spinner {
      width:15px;height:15px;border-radius:50%;
      border:2px solid rgba(235,139,103,.26);
      border-top-color:#e99170;
      animation:spin 1s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .source-list { display:flex; flex-direction:column; gap:1px; }
    .source-row {
      width:100%; min-height:28px; display:flex; align-items:center; gap:10px;
      padding:2px 5px; border-radius:7px; text-align:left;
      color:#efefef; font-size:13px; transition:background .15s,opacity .15s;
    }
    .source-row:hover { background:rgba(255,255,255,.07); }
    .source-row.off { opacity:.38; }
    .source-logo {
      width:14px; height:14px; display:grid; place-items:center;
      border-radius:4px; color:#fff; font-size:9px; font-weight:700;
      box-shadow:0 1px 4px #0008;
    }
    .source-check { margin-left:auto; color:#8fc98c; opacity:0; font-size:11px; }
    .source-row:not(.off) .source-check { opacity:1; }
    .question-wrap { position:absolute; z-index:4; left:45.6%; top:60px; width:262px; }
    .question {
      width:100%; padding:12px 14px; border-radius:13px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(32,32,32,.84); color:#f5f5f5;
      text-align:left; font-size:12px; line-height:1.4;
      box-shadow:0 8px 24px #0004, inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      transition:border-color .18s,background .18s;
    }
    .question:hover { border-color:rgba(255,255,255,.25); background:rgba(40,40,40,.94); }
    .sheet {
      min-width:0; align-self:stretch; overflow:hidden;
      border:1px solid rgba(255,255,255,.11); border-radius:11px;
      background:#1b1b1b; box-shadow:0 9px 27px rgba(0,0,0,.38);
      color:#e3e3e3; font-family:Arial,sans-serif;
      display:flex; flex-direction:column;
    }
    .sheet-top {
      height:25px; flex:none; display:flex; align-items:center; gap:5px;
      padding:0 7px; background:#252525; border-bottom:1px solid #333;
    }
    .traffic { width:7px;height:7px;border-radius:50%; }
    .traffic.red{background:#f26d62}.traffic.yellow{background:#f0c34e}.traffic.green{background:#54c46b}
    .sheet-title { margin-left:auto; font-size:8px; color:#d9d9d9; }
    .ribbon {
      display:flex; align-items:center; gap:11px; height:27px; flex:none;
      padding:0 8px; background:#202020; border-bottom:1px solid #343434;
      white-space:nowrap; overflow:hidden;
    }
    .ribbon span { font-size:7px; color:#cfcfcf; }
    .ribbon span:first-child { color:#60bb72; }
    .formula {
      display:flex; align-items:center; gap:7px; height:20px; flex:none;
      padding:0 8px; background:#202020; border-bottom:1px solid #333;
      color:#bdbdbd; font-size:7px;
    }
    .cell-name { width:29px; border-right:1px solid #444; }
    .formula-value { color:#eee; }
    .table-viewport { flex:1; min-height:0; overflow:auto; scrollbar-width:thin; scrollbar-color:#555 #202020; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    th,td { height:15px; padding:1px 4px; border-right:1px solid #343434; border-bottom:1px solid #343434; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    th { position:sticky; top:0; z-index:1; height:19px; background:#344b6e; color:#f5f5f5; font-size:7px; font-weight:600; text-align:left; }
    th button { width:100%; color:inherit; text-align:left; font-size:inherit; font-weight:inherit; }
    td { color:#e0e0e0; font-size:7.4px; }
    td:first-child { background:#262626; color:#bcbcbc; text-align:center; width:22px; }
    tbody tr { background:#202020; cursor:pointer; }
    tbody tr:nth-child(even) { background:#292929; }
    tbody tr:hover, tbody tr.selected { background:#354665; }
    .sheet-foot {
      height:22px; flex:none; display:flex; align-items:center; gap:8px;
      padding:0 9px; background:#202020; border-top:1px solid #343434;
      font-size:7px; color:#68c27b;
    }
    .sheet-search {
      display:none; position:absolute; right:7px; top:31px; z-index:3;
      width:116px; padding:4px 6px; border:1px solid #4c4c4c; border-radius:4px;
      background:#242424; color:#fff; font-size:9px; outline:none;
    }
    .sheet-search.visible { display:block; }
    .sheet-tools { margin-left:auto; display:flex; align-items:center; gap:6px; }
    .search-toggle {
      display:grid; place-items:center; width:16px;height:16px;
      border-radius:3px; color:#d4d4d4;
    }
    .search-toggle:hover { background:#444; }
    .toast {
      position:absolute; z-index:8; left:50%; bottom:20px; transform:translate(-50%,12px);
      opacity:0; pointer-events:none; padding:9px 14px; border-radius:10px;
      background:rgba(42,44,43,.95); border:1px solid rgba(255,255,255,.13);
      color:#eee; font-size:12px; box-shadow:0 8px 28px #0007;
      transition:opacity .2s,transform .2s; white-space:nowrap;
      backdrop-filter:blur(12px);
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .modal-backdrop {
      position:fixed; inset:0; z-index:20; display:none; place-items:center;
      padding:20px; background:rgba(0,0,0,.58); backdrop-filter:blur(5px);
    }
    .modal-backdrop.open { display:grid; }
    .modal {
      width:min(390px,100%); position:relative; padding:25px;
      border-radius:20px; border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(145deg,#252725,#1c1e1c);
      box-shadow:0 22px 80px #0009;
    }
    .modal h2 { margin:0 0 8px; font-size:19px; font-weight:650; }
    .modal p { margin:0; color:#bdbdbd; font-size:13px; line-height:1.55; }
    .modal-close {
      position:absolute; right:14px; top:12px; width:30px;height:30px;
      border-radius:8px; color:#bbb; font-size:20px;
    }
    .modal-close:hover { background:#ffffff12; color:#fff; }
    .modal-action {
      margin-top:20px; padding:9px 13px; border-radius:9px;
      background:#f2f2f2; color:#1d1d1d; font-size:12px; font-weight:600;
    }
    .modal-action:hover { background:#fff; }
    .modal-list { margin-top:16px; display:grid; gap:9px; color:#d8d8d8; font-size:12px; }
    .modal-list span::before { content:"✓"; margin-right:9px; color:#7dd17f; }
    @media (max-width:900px) {
      #stage { place-items:start center; padding:20px; }
      .window-shell { height:auto; min-height:520px; }
      .surface { height:auto; min-height:520px; overflow:hidden; }
      .layout {
        position:relative; inset:auto; padding:32px 26px 26px;
        grid-template-columns:minmax(0,1.1fr) minmax(220px,.9fr);
        gap:18px 26px;
      }
      .sheet { grid-column:1 / -1; height:360px; }
      .sources { padding-top:115px; }
      .question-wrap { left:calc(50% + 8px); top:40px; width:min(262px,45%); }
    }
    @media (max-width:570px) {
      #stage { padding:12px; }
      .window-shell { width:100%; padding:7px; border-radius:27px; }
      .surface { border-radius:21px; }
      .layout { display:flex; flex-direction:column; gap:17px; padding:25px 19px 20px; }
      .intro-copy { font-size:13px; }
      .apps { margin-top:9px; }
      .app-row { height:49px; }
      .question-wrap { position:static; width:100%; order:2; }
      .question { padding:12px; }
      .sources { padding-top:0; order:3; }
      .sheet { order:4; width:100%; height:360px; }
      .sheet-title { font-size:7px; }
      .source-row { min-height:30px; }
      .toast { max-width:calc(100% - 24px); white-space:normal; text-align:center; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <section class="window-shell" aria-label="Microsoft 365 Copilot">
      <div class="surface">
        <svg class="wallpaper" viewBox="0 0 1100 500" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#172218" stop-opacity="0"/>
              <stop offset=".56" stop-color="#263f22" stop-opacity=".42"/>
              <stop offset="1" stop-color="#182017" stop-opacity=".02"/>
            </linearGradient>
            <linearGradient id="waveB" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#385d2b" stop-opacity=".19"/>
              <stop offset="1" stop-color="#19211b" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M0 390 C180 322 260 458 430 397 C585 342 625 395 760 440 C870 477 991 409 1100 432 L1100 500 L0 500Z" fill="url(#waveA)"/>
          <path d="M0 449 C150 385 251 465 372 438 C540 401 605 463 777 478 C911 490 1018 451 1100 468 L1100 500 L0 500Z" fill="url(#waveB)"/>
        </svg>

        <div class="layout">
          <section class="intro" aria-label="Aplicații Microsoft 365">
            <h1 class="brand-title">Microsoft 365</h1>
            <p class="intro-copy">Analizează date, creează prezentări, redactează documente<br class="desktop-break"> și gestionează e-mailurile cu ajutorul Copilot.</p>
            <button class="upgrade" id="upgradeButton">Fă upgrade</button>

            <nav class="apps" aria-label="Aplicații">
              <button class="app-row" data-app="Excel">
                <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <defs><linearGradient id="exg" x2="1" y2="1"><stop stop-color="#37c46c"/><stop offset="1" stop-color="#08783d"/></linearGradient></defs>
                  <rect x="4" y="2" width="18" height="20" rx="3" fill="url(#exg)"/><path d="M2 6h9v12H2a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" fill="#08783d"/><path d="m2.7 8 2.4 3.8L2.5 16h2l1.6-2.8L7.7 16h2l-2.6-4.2L9.5 8h-2l-1.4 2.5L4.7 8z" fill="#fff"/><path d="M14 6h5M14 10h5M14 14h5M14 18h5" stroke="#d9ffe7" stroke-opacity=".55" stroke-width=".8"/>
                </svg>
                <span class="app-name">Excel</span>
                <svg class="app-open" width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 14 15 5M7 5h8v8" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
              <button class="app-row" data-app="PowerPoint">
                <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <defs><linearGradient id="ppg" x2="1" y2="1"><stop stop-color="#fa8a54"/><stop offset="1" stop-color="#c73522"/></linearGradient></defs>
                  <circle cx="14" cy="12" r="10" fill="url(#ppg)"/><path d="M3 5h9v14H3a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z" fill="#c73522"/><path d="M3.6 8h3.1c2.1 0 3.2 1 3.2 2.8 0 1.9-1.2 2.9-3.2 2.9H5.5V16H3.6zm1.9 4.1h1.1c.9 0 1.4-.4 1.4-1.3 0-.8-.5-1.2-1.4-1.2H5.5z" fill="white"/>
                </svg>
                <span class="app-name">PowerPoint</span>
                <svg class="app-open" width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 14 15 5M7 5h8v8" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
              <button class="app-row" data-app="Word">
                <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <defs><linearGradient id="wog" x2="1" y2="1"><stop stop-color="#45a7fa"/><stop offset="1" stop-color="#164fc4"/></linearGradient></defs>
                  <rect x="4" y="2" width="18" height="20" rx="3" fill="url(#wog)"/><path d="M2 6h9v12H2a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" fill="#1557b0"/><path d="m1.8 8 1.3 8h1.7l1.1-4.8L7 16h1.8l1.3-8H8.3l-.7 5.1L6.5 8H5.3l-1.1 5.1L3.6 8z" fill="#fff"/><path d="M14 6h5M14 10h5M14 14h5M14 18h5" stroke="#e3f1ff" stroke-opacity=".55" stroke-width=".8"/>
                </svg>
                <span class="app-name">Word</span>
                <svg class="app-open" width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 14 15 5M7 5h8v8" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
              <button class="app-row" data-app="Outlook">
                <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <defs><linearGradient id="oug" x2="1" y2="1"><stop stop-color="#42b9ff"/><stop offset="1" stop-color="#1263ba"/></linearGradient></defs>
                  <rect x="5" y="2" width="17" height="20" rx="3" fill="url(#oug)"/><path d="M5 7h15v11H5z" fill="#1478c4"/><path d="m5 8 7.5 5.5L20 8" fill="none" stroke="#d8f2ff" stroke-width="1.2"/><rect x="0" y="6" width="11" height="12" rx="2" fill="#07549a"/><circle cx="5.5" cy="12" r="3.2" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M5.5 9.7v4.6" stroke="#fff" stroke-width="1.1"/>
                </svg>
                <span class="app-name">Outlook</span>
                <span class="beta">Beta</span>
                <svg class="app-open" width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 14 15 5M7 5h8v8" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
            </nav>
          </section>

          <section class="sources" aria-label="Surse de date">
            <p class="source-status"><span class="spinner" id="spinner"></span><span id="statusText">Se caută...</span></p>
            <div class="source-list" id="sourceList">
              <button class="source-row" data-source="Dalopa"><span class="source-logo" style="background:#1556a2">D</span><span>Dalopa</span><span class="source-check">✓</span></button>
              <button class="source-row" data-source="S&amp;P Global"><span class="source-logo" style="background:#d91136;border-radius:2px;width:14px;height:7px"></span><span>S&amp;P Global</span><span class="source-check">✓</span></button>
              <button class="source-row" data-source="Moody's"><span class="source-logo" style="background:#172b70">M</span><span>Moody’s</span><span class="source-check">✓</span></button>
              <button class="source-row" data-source="LSEG"><span class="source-logo" style="background:#344fd9">L</span><span>LSEG</span><span class="source-check">✓</span></button>
              <button class="source-row" data-source="FactSet"><span class="source-logo" style="background:#e7f5ff;color:#3288b5">F</span><span>FactSet</span><span class="source-check">✓</span></button>
              <button class="source-row" data-source="PitchBook"><span class="source-logo" style="background:#3678ac">↗</span><span>PitchBook</span><span class="source-check">✓</span></button>
            </div>
          </section>

          <button class="question-wrap question" id="questionButton" aria-label="Rulează analiza Copilot">
            Care sunt companiile cu cele mai mari creșteri din portofoliul meu și de ce?
          </button>

          <section class="sheet" aria-label="Previzualizare foaie de calcul">
            <div class="sheet-top">
              <span class="traffic red"></span><span class="traffic yellow"></span><span class="traffic green"></span>
              <span class="sheet-title">Portofoliu — Excel</span>
            </div>
            <div class="ribbon">
              <span>Fișier</span><span>Inserare</span><span>Desenare</span><span>Aspect pagină</span><span>Formule</span><span>Date</span><span>Revizuire</span><span>Vizualizare</span>
            </div>
            <div class="formula">
              <span class="cell-name">A1</span><span>fx</span><span class="formula-value" id="formulaValue">Ticker</span>
              <div class="sheet-tools">
                <button class="search-toggle" id="searchToggle" aria-label="Caută în tabel">
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="6.7" cy="6.7" r="4.4" stroke="currentColor" stroke-width="1.4"/><path d="m10 10 3.5 3.5" stroke="currentColor" stroke-width="1.4"/></svg>
                </button>
              </div>
            </div>
            <input class="sheet-search" id="sheetSearch" type="search" aria-label="Filtrează companiile" placeholder="Caută o companie…">
            <div class="table-viewport">
              <table>
                <thead><tr>
                  <th style="width:22px"></th>
                  <th style="width:48px"><button data-sort="ticker">Ticker ↕</button></th>
                  <th style="width:94px"><button data-sort="company">Companie ↕</button></th>
                  <th style="width:70px"><button data-sort="sector">Sector ↕</button></th>
                  <th><button data-sort="industry">Industrie ↕</button></th>
                </tr></thead>
                <tbody id="companyRows"></tbody>
              </table>
            </div>
            <div class="sheet-foot"><span>▰</span><span>Portofoliu</span><span style="color:#888">+</span><span style="margin-left:auto;color:#9a9a9a">Gata</span></div>
          </section>
        </div>
        <div class="toast" id="toast" role="status"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="modal">
      <button class="modal-close" id="modalClose" aria-label="Închide">×</button>
      <h2 id="modalTitle"></h2>
      <p id="modalCopy"></p>
      <div class="modal-list" id="modalList"></div>
      <button class="modal-action" id="modalAction">Continuă</button>
    </section>
  </div>

  <script>
    const companies = [
      {ticker:"NVDA",company:"Nvidia Technologies",sector:"Technology",industry:"Semiconductors"},
      {ticker:"LLY",company:"Eli Lilly",sector:"Healthcare",industry:"Pharmaceuticals"},
      {ticker:"MSFT",company:"Microsoft",sector:"Technology",industry:"Software"},
      {ticker:"AAPL",company:"Apple Inc.",sector:"Technology",industry:"Consumer Electronics"},
      {ticker:"GOOGL",company:"Alphabet",sector:"Technology",industry:"Interactive Media"},
      {ticker:"COST",company:"Costco Wholesale",sector:"Consumer",industry:"Retail"},
      {ticker:"TSLA",company:"Tesla Inc.",sector:"Consumer",industry:"Automobiles"},
      {ticker:"V",company:"Visa Inc.",sector:"Financials",industry:"Payments"},
      {ticker:"JPM",company:"JPMorgan Chase",sector:"Financials",industry:"Banks"},
      {ticker:"AVGO",company:"Broadcom Inc.",sector:"Technology",industry:"Semiconductors"},
      {ticker:"NFLX",company:"Netflix Inc.",sector:"Communication",industry:"Entertainment"},
      {ticker:"AMD",company:"Advanced Micro Devices",sector:"Technology",industry:"Semiconductors"},
      {ticker:"ORCL",company:"Oracle Corporation",sector:"Technology",industry:"Software"},
      {ticker:"UNH",company:"UnitedHealth Group",sector:"Healthcare",industry:"Health Services"},
      {ticker:"CRM",company:"Salesforce Inc.",sector:"Technology",industry:"Software"},
      {ticker:"XOM",company:"Exxon Mobil",sector:"Energy",industry:"Oil & Gas"},
      {ticker:"WMT",company:"Walmart Inc.",sector:"Consumer",industry:"Retail"},
      {ticker:"PLTR",company:"Palantir Technologies",sector:"Technology",industry:"Software"},
      {ticker:"GS",company:"Goldman Sachs",sector:"Financials",industry:"Investment Banking"},
      {ticker:"DIS",company:"Walt Disney Co.",sector:"Communication",industry:"Entertainment"}
    ];
    const enabledSources = new Set(["Dalopa","S&P Global","Moody's","LSEG","FactSet","PitchBook"]);
    let sortKey = "ticker";
    let sortDirection = 1;
    let selectedTicker = "NVDA";
    let toastTimer;

    const rows = document.getElementById("companyRows");
    const formulaValue = document.getElementById("formulaValue");
    const toast = document.getElementById("toast");
    const statusText = document.getElementById("statusText");
    const spinner = document.getElementById("spinner");
    const searchInput = document.getElementById("sheetSearch");

    function renderRows() {
      const query = searchInput.value.trim().toLowerCase();
      const sorted = [...companies].sort((a,b) => {
        const cmp = String(a[sortKey]).localeCompare(String(b[sortKey]));
        return cmp * sortDirection;
      }).filter(item => Object.values(item).some(value => value.toLowerCase().includes(query)));
      rows.innerHTML = "";
      sorted.forEach((item,index) => {
        const tr = document.createElement("tr");
        tr.className = item.ticker === selectedTicker ? "selected" : "";
        tr.innerHTML = `<td>${index + 1}</td><td>${item.ticker}</td><td title="${item.company}">${item.company}</td><td title="${item.sector}">${item.sector}</td><td title="${item.industry}">${item.industry}</td>`;
        tr.addEventListener("click", () => {
          selectedTicker = item.ticker;
          formulaValue.textContent = `${item.company} — ${item.sector}`;
          renderRows();
          showToast(`${item.company} selectată în foaia de calcul`);
        });
        rows.appendChild(tr);
      });
    }
    renderRows();

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    document.querySelectorAll("[data-sort]").forEach(button => {
      button.addEventListener("click", () => {
        const key = button.dataset.sort;
        if (sortKey === key) sortDirection *= -1;
        else { sortKey = key; sortDirection = 1; }
        renderRows();
      });
    });

    document.getElementById("searchToggle").addEventListener("click", () => {
      searchInput.classList.toggle("visible");
      if (searchInput.classList.contains("visible")) searchInput.focus();
      else { searchInput.value = ""; renderRows(); }
    });
    searchInput.addEventListener("input", renderRows);

    document.querySelectorAll(".source-row").forEach(button => {
      button.addEventListener("click", () => {
        const name = button.dataset.source;
        if (enabledSources.has(name)) enabledSources.delete(name);
        else enabledSources.add(name);
        button.classList.toggle("off", !enabledSources.has(name));
        statusText.textContent = `${enabledSources.size} surse active`;
        spinner.style.display = enabledSources.size ? "block" : "none";
      });
    });

    function openModal(title,copy,items,actionText,onAction) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalCopy").textContent = copy;
      const list = document.getElementById("modalList");
      list.replaceChildren();
      items.forEach(text => {
        const span = document.createElement("span");
        span.textContent = text;
        list.appendChild(span);
      });
      const action = document.getElementById("modalAction");
      action.textContent = actionText;
      action.onclick = () => { closeModal(); if (onAction) onAction(); };
      document.getElementById("modalBackdrop").classList.add("open");
    }
    function closeModal() { document.getElementById("modalBackdrop").classList.remove("open"); }

    document.getElementById("upgradeButton").addEventListener("click", () => {
      openModal(
        "Deblochează mai mult cu Microsoft 365",
        "Obține acces la funcțiile Copilot și instrumentele premium pentru activitatea ta.",
        ["Copilot în Excel, Word și PowerPoint","Spațiu de stocare extins în cloud","Protecție avansată pentru fișiere"],
        "Începe perioada de probă",
        () => showToast("Perioada de probă a fost pregătită pentru activare.")
      );
    });

    document.querySelectorAll(".app-row").forEach(button => {
      button.addEventListener("click", () => {
        const app = button.dataset.app;
        openModal(
          `Deschide ${app}`,
          `Continuă în ${app} și lucrează cu fișierele tale Microsoft 365.`,
          [`Aplicația ${app} este gata de utilizare`,"Documentele recente sunt sincronizate"],
          `Deschide ${app}`,
          () => showToast(`${app} este pregătit într-un spațiu de lucru nou.`)
        );
      });
    });

    document.getElementById("questionButton").addEventListener("click", () => {
      if (!enabledSources.size) {
        showToast("Activează cel puțin o sursă de date pentru a începe analiza.");
        return;
      }
      statusText.textContent = "Se analizează portofoliul...";
      spinner.style.display = "block";
      const button = document.getElementById("questionButton");
      button.textContent = "Analiză în curs: se compară evoluția companiilor și datele de piață…";
      button.disabled = true;
      setTimeout(() => {
        statusText.textContent = `Analiză completă · ${enabledSources.size} surse`;
        spinner.style.display = "none";
        button.textContent = "NVDA și Eli Lilly conduc creșterile, susținute de cererea pentru cipuri AI și de rezultate solide în sănătate.";
        button.disabled = false;
        selectedTicker = "NVDA";
        formulaValue.textContent = "Nvidia Technologies — Technology";
        renderRows();
        showToast("Analiza portofoliului este gata.");
      }, 1500);
    });

    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", event => {
      if (event.target.id === "modalBackdrop") closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
